<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-label="Learning rate changes the outcome">
<title>Learning rate changes the outcome</title><desc>The two-point objective uses mean squared error divided by two.</desc>
<rect width="800" height="480" fill="white"/>
<g font-family="Arial, sans-serif" fill="#17324D">
<text x="40" y="34" font-size="23" font-weight="bold">Learning rate changes the outcome</text>
<text x="40" y="57" font-size="13">The two-point objective uses mean squared error divided by two.</text>
